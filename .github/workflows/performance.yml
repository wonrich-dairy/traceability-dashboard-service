name: Performance test (JMeter)

# JMeter load test against staging (SCRUM-123, same shape as Quality Lab's SCRUM-43).
#
# Runs two ways:
#   - after every staging deployment, as the `performance` job in ci-cd.yml. It is a separate job,
#     so a performance regression fails the run but never blocks or undoes the deployment;
#   - by hand: Actions -> Performance test (JMeter) -> Run workflow, with the load profile and
#     thresholds as inputs.
#
# Never point this at production: Free-tier apps have a daily CPU quota.
# Load profile, thresholds and how to read the report: docs/performance-testing.md.

on:
  workflow_dispatch:
    inputs:
      users:
        description: Concurrent virtual users
        default: "10"
      ramp_seconds:
        description: Seconds to start all users
        default: "30"
      duration_seconds:
        description: Test length in seconds
        default: "120"
      think_ms:
        description: Minimum pause between a user's requests (ms); up to 500 ms is added at random
        default: "1000"
      p95_ms:
        description: Fail if p95 latency exceeds this (ms). NFR1 is 2000
        default: "2000"
      max_error_pct:
        description: Fail if the error rate exceeds this (%)
        default: "1"
  workflow_call:
    inputs:
      users:            { type: string, default: "10" }
      ramp_seconds:     { type: string, default: "30" }
      duration_seconds: { type: string, default: "120" }
      think_ms:         { type: string, default: "1000" }
      p95_ms:           { type: string, default: "2000" }
      max_error_pct:    { type: string, default: "1" }

permissions:
  contents: read

env:
  JMETER_VERSION: "5.6.3"
  PLAN: perf/traceability.jmx

jobs:
  jmeter:
    name: JMeter against staging
    runs-on: ubuntu-latest
    environment: staging          # APP_HOST, DB_HOST, DB_NAME, DB_USER variables; AUTH_SIGNING_KEY, DB_PASSWORD secrets
    timeout-minutes: 30
    env:
      USERS: ${{ inputs.users }}
      RAMP: ${{ inputs.ramp_seconds }}
      DURATION: ${{ inputs.duration_seconds }}
      THINK_MS: ${{ inputs.think_ms }}
      P95_MS: ${{ inputs.p95_ms }}
      MAX_ERROR_PCT: ${{ inputs.max_error_pct }}
      TARGET_HOST: ${{ vars.PERF_TARGET_HOST || vars.APP_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache JMeter
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: ~/jmeter
          key: jmeter-${{ env.JMETER_VERSION }}

      - name: Install JMeter
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" | tar xz -C ~
          mv ~/"apache-jmeter-${JMETER_VERSION}" ~/jmeter

      - name: Check inputs
        run: |
          for v in USERS RAMP DURATION THINK_MS P95_MS MAX_ERROR_PCT; do
            [[ "${!v}" =~ ^[0-9]+([.][0-9]+)?$ ]] || { echo "::error::$v must be a number, got '${!v}'"; exit 1; }
          done
          [ -n "$TARGET_HOST" ] || { echo "::error::Set the APP_HOST (or PERF_TARGET_HOST) variable on the staging environment"; exit 1; }
          echo "Target https://$TARGET_HOST - $USERS users, ${RAMP}s ramp-up, ${DURATION}s, think ${THINK_MS}ms+; thresholds p95 ${P95_MS}ms, errors ${MAX_ERROR_PCT}%"

      # /api/batches needs a QualityControlOfficer token and Auth tokens last an hour, so a stored one
      # cannot work: mint a fresh one from the staging signing key before every run.
      - name: Mint a test token
        env:
          AUTH_SIGNING_KEY: ${{ secrets.AUTH_SIGNING_KEY }}
        run: |
          [ -n "$AUTH_SIGNING_KEY" ] || { echo "::error::Set the AUTH_SIGNING_KEY secret on the staging environment"; exit 1; }
          TOKEN=$(python3 scripts/mint-perf-token.py)
          echo "::add-mask::$TOKEN"
          echo "PERF_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # The batch lookups need data to look up: 1,000 generated PERF- batches. Staging only: the guard
      # stops the step before it touches anything whose name says production.
      - name: Seed performance data (staging only)
        env:
          MYSQL_PWD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
        run: |
          [ -n "$DB_HOST" ] && [ -n "$DB_NAME" ] && [ -n "$DB_USER" ] && [ -n "$MYSQL_PWD" ] \
            || { echo "::error::Set DB_HOST, DB_NAME, DB_USER and DB_PASSWORD on the staging environment"; exit 1; }
          case "$DB_NAME" in *prod*) echo "::error::$DB_NAME looks like production; the load test seeds staging only"; exit 1 ;; esac
          mysql --host="$DB_HOST" --user="$DB_USER" --ssl-mode=REQUIRED "$DB_NAME" < perf/seed-batches.sql
          mysql --host="$DB_HOST" --user="$DB_USER" --ssl-mode=REQUIRED "$DB_NAME" --batch --skip-column-names \
            -e "SELECT CONCAT('seeded ', COUNT(*), ' PERF batches') FROM batch_records WHERE BatchId LIKE 'PERF-%'"

      - name: Run load test
        run: |
          mkdir -p results
          ~/jmeter/bin/jmeter -n -t "$PLAN" \
            -l results/results.jtl -j results/jmeter.log \
            -e -o results/report \
            -Jhost="$TARGET_HOST" -Jtoken="$PERF_TOKEN" \
            -Jusers="$USERS" -Jramp="$RAMP" -Jduration="$DURATION" -Jthink_ms="$THINK_MS" \
            -Jaggregate_rpt_pct2=95 \
            "-Jjmeter.reportgenerator.sample_filter=^(read|write): .*"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: results/
          retention-days: 30

      - name: Check thresholds
        run: bash perf/check-thresholds.sh results/report/statistics.json "$P95_MS" "$MAX_ERROR_PCT"

      # Always runs, so a failed run does not leave 1,000 test batches behind on staging.
      - name: Remove performance data
        if: always()
        env:
          MYSQL_PWD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
        run: |
          case "$DB_NAME" in *prod*) echo "::error::$DB_NAME looks like production; nothing was removed"; exit 1 ;; esac
          [ -n "$DB_HOST" ] && [ -n "$DB_NAME" ] && [ -n "$DB_USER" ] && [ -n "$MYSQL_PWD" ] || exit 0
          mysql --host="$DB_HOST" --user="$DB_USER" --ssl-mode=REQUIRED "$DB_NAME" < perf/reset-seed-batches.sql
          mysql --host="$DB_HOST" --user="$DB_USER" --ssl-mode=REQUIRED "$DB_NAME" --batch --skip-column-names \
            -e "SELECT CONCAT('PERF batches left: ', COUNT(*)) FROM batch_records WHERE BatchId LIKE 'PERF-%'"
