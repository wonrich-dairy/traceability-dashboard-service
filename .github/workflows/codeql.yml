name: CodeQL

# Static analysis (SAST) of the C# code (SCRUM-112). Results appear in the repository's
# Security tab under Code scanning; High / Critical findings also fail this workflow.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Weekly, because new CodeQL queries can find problems in code nobody has touched.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (C#)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write   # upload results to the Security tab
    steps:
      - uses: actions/checkout@v4

      # build-mode none: CodeQL reads the C# source directly, so no .NET build is needed here.
      # Query suite, excluded paths and triaged rules are in the config file.
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
          output: codeql-results

      # CodeQL itself only reports. This makes a High / Critical finding fail the check, with the
      # threshold kept here in the repository rather than in GitHub's settings UI.
      - name: Fail on High or Critical findings
        run: python3 scripts/codeql-gate.py codeql-results
