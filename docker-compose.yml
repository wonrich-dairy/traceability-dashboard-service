# Traceability Service on its own (SCRUM-124). The database is the remote MySQL server; there is no
# database container. Kafka runs from wonrich-infra on the shared wonrich-net network, so start
# that first:  (cd ../wonrich-infra && docker compose up -d)
services:
  traceability-service:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
      # Restore pulls Wonrich.QualityLab.Contracts from GitHub Packages; see nuget.config
      secrets: [github_packages_token]
    container_name: trc-api
    ports:
      - "${TRC_HOST_PORT:-5240}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__TraceabilityDb: "${TRC_DB_CONNECTION:?Set TRC_DB_CONNECTION in .env}"
      Auth__SigningKey: "${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY in .env}"
      # Defaults target the local broker; staging values go in .env.
      Kafka__BootstrapServers: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
      Kafka__SecurityProtocol: "${KAFKA_SECURITY_PROTOCOL:-Plaintext}"
      Kafka__SaslMechanism: "${KAFKA_SASL_MECHANISM:-}"
      Kafka__SaslUsername: "${KAFKA_SASL_USERNAME:-}"
      Kafka__SaslPassword: "${KAFKA_SASL_PASSWORD:-}"
      # MCC and Intake Service, for resolving consignment data (SCRUM-12, SCRUM-132). The client ID and
      # secret are a service account's sign-in at the Auth Service. Resolution stays off until all are set.
      Services__Auth__BaseUrl: "${AUTH_BASE_URL:-}"
      Services__MccIntake__BaseUrl: "${MCC_INTAKE_BASE_URL:-}"
      Services__MccIntake__TimeoutSeconds: "${MCC_INTAKE_TIMEOUT_SECONDS:-10}"
      Services__MccIntake__ClientId: "${MCC_INTAKE_CLIENT_ID:-}"
      Services__MccIntake__ClientSecret: "${MCC_INTAKE_CLIENT_SECRET:-}"
      Upstream__MaxAttempts: "${UPSTREAM_MAX_ATTEMPTS:-10}"
      Upstream__PollIntervalSeconds: "${UPSTREAM_POLL_INTERVAL_SECONDS:-30}"
      Cors__AllowedOrigins__0: "${CORS_ORIGIN:-http://localhost:5173}"
    networks: [wonrich-net]

networks:
  wonrich-net:
    external: true

secrets:
  github_packages_token:
    # export GITHUB_PACKAGES_TOKEN=$(gh auth token) before building (token needs read:packages)
    environment: GITHUB_PACKAGES_TOKEN
